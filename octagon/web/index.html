<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octagon Fight League</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    /* Сцена всегда 9:16. В OBS (1080×1920) заполняет кадр целиком,
       в обычном окне браузера вписывается по центру с чёрными полями. */
    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      height: min(100vh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
    }
    #stage canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    /* Отладка (?debug=1): безопасные зоны TikTok и FPS */
    .safe {
      position: absolute;
      left: 0;
      right: 0;
      background: rgba(255, 0, 80, 0.18);
      border: 2px dashed rgba(255, 0, 80, 0.8);
      box-sizing: border-box;
      color: #fff;
      font: 600 14px/1.4 system-ui, sans-serif;
      padding: 6px 10px;
      pointer-events: none;
      display: none;
    }
    #safe-top { top: 0; height: calc(150 / 1920 * 100%); }
    #safe-bottom { bottom: 0; height: calc(300 / 1920 * 100%); }
    #fps {
      position: absolute;
      right: 8px;
      top: calc(150 / 1920 * 100% + 8px);
      color: #0f0;
      font: 600 14px monospace;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      display: none;
    }
    body.debug .safe, body.debug #fps { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <div id="safe-top" class="safe">Зона интерфейса TikTok (150 px)</div>
    <div id="safe-bottom" class="safe">Зона чата TikTok (300 px)</div>
    <div id="fps"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Размеры и параметры сцены ----------
    const WIDTH = 1080;
    const HEIGHT = 1920;
    const R = 5;               // радиус октагона (до стоек), метры
    const FENCE_H = 1.8;       // высота сетки
    const SIDES = 8;
    const POST_START = Math.PI / 8;
    const RED_ANGLE = POST_START + 3 * Math.PI / 4;   // красный угол (слева)
    const BLUE_ANGLE = POST_START + 7 * Math.PI / 4;  // синий угол (справа)

    const params = new URLSearchParams(location.search);
    if (params.has('debug')) document.body.classList.add('debug');

    // ---------- Рендерер ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(WIDTH, HEIGHT, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('stage').prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020203);
    scene.fog = new THREE.FogExp2(0x0b0d12, 0.045);   // дымка зала

    const camera = new THREE.PerspectiveCamera(62, WIDTH / HEIGHT, 0.1, 100);

    // ---------- Вспомогательные текстуры ----------
    function canvasTexture(size, draw, srgb = true) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      draw(c.getContext('2d'), size);
      const t = new THREE.CanvasTexture(c);
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return t;
    }

    function radialTexture(inner, outer) {
      return canvasTexture(128, (g, s) => {
        const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        grd.addColorStop(0, inner);
        grd.addColorStop(1, outer);
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
      });
    }

    // Ковёр с логотипом лиги
    const matTexture = canvasTexture(2048, (g, S) => {
      g.fillStyle = '#d8d4cb';
      g.fillRect(0, 0, S, S);
      // лёгкая фактура ткани
      for (let i = 0; i < 9000; i++) {
        g.fillStyle = `rgba(0,0,0,${Math.random() * 0.035})`;
        g.fillRect(Math.random() * S, Math.random() * S, 3, 3);
      }
      const toCanvas = (a, k) => [(0.5 + 0.5 * k * Math.cos(a)) * S, (0.5 + 0.5 * k * Math.sin(a)) * S];

      // контур октагона у края
      g.strokeStyle = '#1a1a1a';
      g.lineWidth = 10;
      g.beginPath();
      for (let i = 0; i <= SIDES; i++) {
        const [x, y] = toCanvas(POST_START + i * Math.PI / 4, 0.93);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();

      // метки углов
      const cornerMark = (a, color) => {
        const [x, y] = toCanvas(a, 0.86);
        g.fillStyle = color;
        g.beginPath();
        g.arc(x, y, 70, 0, Math.PI * 2);
        g.fill();
      };
      cornerMark(RED_ANGLE, '#c0141d');
      cornerMark(BLUE_ANGLE, '#1546c0');

      // центральная эмблема
      const c = S / 2;
      g.strokeStyle = '#8f1118';
      g.lineWidth = 22;
      g.beginPath(); g.arc(c, c, 430, 0, Math.PI * 2); g.stroke();
      g.lineWidth = 8;
      g.beginPath(); g.arc(c, c, 390, 0, Math.PI * 2); g.stroke();

      // маленький октагон-значок
      g.fillStyle = '#111';
      g.beginPath();
      for (let i = 0; i < SIDES; i++) {
        const a = POST_START + i * Math.PI / 4;
        const x = c + 95 * Math.cos(a), y = c - 215 + 95 * Math.sin(a);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath();
      g.fill();
      g.fillStyle = '#d8d4cb';
      g.font = '900 70px "Arial Black", Impact, sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('OFL', c, c - 212);

      g.fillStyle = '#111';
      g.font = '900 150px "Arial Black", Impact, sans-serif';
      g.fillText('OCTAGON', c, c + 10);
      g.fillStyle = '#8f1118';
      g.font = '900 78px "Arial Black", Impact, sans-serif';
      g.fillText('FIGHT LEAGUE', c, c + 150);
    });

    // Сетка рабица (ромбы)
    const fenceTexture = canvasTexture(64, (g, s) => {
      g.clearRect(0, 0, s, s);
      g.strokeStyle = '#0a0a0a';
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(0, 0); g.lineTo(s, s);
      g.moveTo(s, 0); g.lineTo(0, s);
      g.stroke();
    });
    fenceTexture.wrapS = fenceTexture.wrapT = THREE.RepeatWrapping;

    const glowTexture = radialTexture('rgba(255,255,255,1)', 'rgba(255,255,255,0)');
    const smokeTexture = radialTexture('rgba(150,160,180,0.55)', 'rgba(0,0,0,0)');

    // ---------- Материалы ----------
    const M = {
      black: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6, metalness: 0.3 }),
      vinyl: new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.45 }),
      redPad: new THREE.MeshStandardMaterial({ color: 0xb0121b, roughness: 0.55 }),
      apron: new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.9 }),
      stands: new THREE.MeshStandardMaterial({ color: 0x15161b, roughness: 1 }),
      floor: new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 1 }),
      crowd: new THREE.MeshStandardMaterial({ color: 0x3a3d48, roughness: 1 }),
    };

    // ---------- Октагон ----------
    const octagon = new THREE.Group();
    scene.add(octagon);

    // Помост
    const apron = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.7, R + 0.9, 1, SIDES, 1, false, POST_START + Math.PI / 2), M.apron);
    apron.position.y = -0.5;
    apron.receiveShadow = true;
    octagon.add(apron);

    // Красная полоса по краю помоста
    const stripe = new THREE.Mesh(
      new THREE.CylinderGeometry(R + 0.72, R + 0.76, 0.12, SIDES, 1, true, POST_START + Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x8f1118, roughness: 0.6, emissive: 0x2a0004 })
    );
    stripe.position.y = -0.12;
    octagon.add(stripe);

    // Ковёр
    const mat = new THREE.Mesh(
      new THREE.CircleGeometry(R + 0.02, SIDES, POST_START),
      new THREE.MeshStandardMaterial({ map: matTexture, roughness: 0.85 })
    );
    mat.rotation.x = -Math.PI / 2;
    mat.position.y = 0.005;
    mat.receiveShadow = true;
    octagon.add(mat);

    // Стойки с красными накладками
    const postGeo = new THREE.CylinderGeometry(0.08, 0.08, FENCE_H + 0.2, 16);
    const padGeo = new THREE.CylinderGeometry(0.17, 0.17, FENCE_H - 0.3, 20);
    const capGeo = new THREE.SphereGeometry(0.17, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2);
    for (let i = 0; i < SIDES; i++) {
      const a = POST_START + i * Math.PI / 4;
      const x = R * Math.cos(a), z = R * Math.sin(a);

      const post = new THREE.Mesh(postGeo, M.black);
      post.position.set(x, (FENCE_H + 0.2) / 2, z);
      post.castShadow = true;
      octagon.add(post);

      const pad = new THREE.Mesh(padGeo, M.redPad);
      pad.position.set(x, 0.15 + (FENCE_H - 0.3) / 2, z);
      pad.castShadow = true;
      octagon.add(pad);

      const cap = new THREE.Mesh(capGeo, M.redPad);
      cap.position.set(x, FENCE_H - 0.15, z);
      octagon.add(cap);
    }

    // Сетка и мягкие планки между стойками
    const sideLen = 2 * R * Math.sin(Math.PI / SIDES);
    const apothem = R * Math.cos(Math.PI / SIDES);
    const panelH = FENCE_H - 0.35;
    const fenceMat = new THREE.MeshStandardMaterial({
      map: fenceTexture,
      transparent: true,
      alphaTest: 0.02,
      side: THREE.DoubleSide,
      depthWrite: false,
      roughness: 0.4,
      metalness: 0.6,
    });
    fenceMat.map.repeat.set(sideLen / 0.12, panelH / 0.12);
    const panelGeo = new THREE.PlaneGeometry(sideLen - 0.2, panelH);
    const railGeo = new THREE.BoxGeometry(sideLen - 0.2, 0.16, 0.18);
    const bottomGeo = new THREE.BoxGeometry(sideLen - 0.2, 0.3, 0.14);
    for (let i = 0; i < SIDES; i++) {
      const m = POST_START + (i + 0.5) * Math.PI / 4;
      const x = apothem * Math.cos(m), z = apothem * Math.sin(m);

      const panel = new THREE.Mesh(panelGeo, fenceMat);
      panel.position.set(x, 0.3 + panelH / 2, z);
      panel.lookAt(0, panel.position.y, 0);
      panel.renderOrder = 2;
      octagon.add(panel);

      const rail = new THREE.Mesh(railGeo, M.vinyl);
      rail.position.set(x, FENCE_H - 0.05, z);
      rail.lookAt(0, rail.position.y, 0);
      rail.castShadow = true;
      octagon.add(rail);

      const bottom = new THREE.Mesh(bottomGeo, M.vinyl);
      bottom.position.set(x, 0.15, z);
      bottom.lookAt(0, bottom.position.y, 0);
      bottom.castShadow = true;
      octagon.add(bottom);
    }

    // ---------- Зал ----------
    const FLOOR_Y = -1;
    const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 64), M.floor);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = FLOOR_Y;
    floor.receiveShadow = true;
    scene.add(floor);

    // Трибуны: 3 ступени + задняя стена (профиль, повёрнутый вокруг центра)
    const ROWS = [
      { r: R + 5.0, y: FLOOR_Y + 0.45 },
      { r: R + 6.4, y: FLOOR_Y + 1.15 },
      { r: R + 7.8, y: FLOOR_Y + 1.85 },
    ];
    const profile = [new THREE.Vector2(R + 4.3, FLOOR_Y)];
    ROWS.forEach((row, i) => {
      const inner = row.r - 0.7;
      const outer = row.r + 0.7;
      if (i > 0) profile.push(new THREE.Vector2(inner, ROWS[i - 1].y));
      profile.push(new THREE.Vector2(inner, row.y));
      profile.push(new THREE.Vector2(outer, row.y));
    });
    profile.push(new THREE.Vector2(R + 8.5, FLOOR_Y + 6));
    const stands = new THREE.Mesh(new THREE.LatheGeometry(profile, 96), M.stands);
    stands.material.side = THREE.DoubleSide;
    scene.add(stands);

    // Силуэты зрителей (instanced: тело + голова)
    const bodyGeo = new THREE.CapsuleGeometry(0.2, 0.42, 4, 8);
    const headGeo = new THREE.SphereGeometry(0.13, 10, 8);
    const people = [];
    ROWS.forEach((row, rowIndex) => {
      const count = Math.floor((2 * Math.PI * row.r) / 0.52);
      for (let i = 0; i < count; i++) {
        if (Math.random() < 0.06) continue;           // пустые места
        const a = (i / count) * Math.PI * 2 + (rowIndex * 0.13) + (Math.random() - 0.5) * 0.02;
        const r = row.r + (Math.random() - 0.5) * 0.15;
        people.push({
          x: r * Math.cos(a),
          z: r * Math.sin(a),
          y: row.y,
          s: 0.9 + Math.random() * 0.25,
          phase: Math.random() * Math.PI * 2,
          speed: 1.5 + Math.random() * 2,
          shade: 0.55 + Math.random() * 0.45,
        });
      }
    });
    const bodies = new THREE.InstancedMesh(bodyGeo, M.crowd, people.length);
    const heads = new THREE.InstancedMesh(headGeo, M.crowd, people.length);
    const color = new THREE.Color();
    people.forEach((p, i) => {
      color.setScalar(p.shade);
      bodies.setColorAt(i, color);
      heads.setColorAt(i, color);
    });
    scene.add(bodies, heads);

    const tmp = new THREE.Object3D();
    let hype = false;
    function updateCrowd(t) {
      const amp = hype ? 0.12 : 0.025;
      people.forEach((p, i) => {
        const bob = Math.max(0, Math.sin(t * p.speed * (hype ? 2.2 : 1) + p.phase)) * amp;
        tmp.position.set(p.x, p.y + 0.42 * p.s + bob, p.z);
        tmp.scale.setScalar(p.s);
        tmp.updateMatrix();
        bodies.setMatrixAt(i, tmp.matrix);
        tmp.position.y = p.y + 0.86 * p.s + bob;
        tmp.updateMatrix();
        heads.setMatrixAt(i, tmp.matrix);
      });
      bodies.instanceMatrix.needsUpdate = true;
      heads.instanceMatrix.needsUpdate = true;
    }

    // Световая ферма над клеткой
    const TRUSS_Y = 11;
    const truss = new THREE.Mesh(new THREE.TorusGeometry(R + 1.2, 0.12, 6, SIDES), M.black);
    truss.rotation.x = Math.PI / 2;
    truss.rotation.z = POST_START;
    truss.position.y = TRUSS_Y;
    scene.add(truss);
    const lampMat = new THREE.SpriteMaterial({ map: glowTexture, color: 0xfff4e0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
    for (let i = 0; i < SIDES; i++) {
      const a = POST_START + i * Math.PI / 4;
      const lamp = new THREE.Sprite(lampMat);
      lamp.position.set((R + 1.2) * Math.cos(a), TRUSS_Y - 0.15, (R + 1.2) * Math.sin(a));
      lamp.scale.setScalar(0.9);
      scene.add(lamp);
    }

    // ---------- Свет ----------
    scene.add(new THREE.HemisphereLight(0x8090a8, 0x050505, 0.35));

    // Главный прожектор сверху
    const spot = new THREE.SpotLight(0xfff2dd, 4.2, 0, Math.PI / 5.2, 0.55, 0);
    spot.position.set(0, 14, 0);
    spot.target.position.set(0, 0, 0);
    spot.castShadow = true;
    spot.shadow.mapSize.set(2048, 2048);
    spot.shadow.camera.near = 6;
    spot.shadow.camera.far = 20;
    spot.shadow.bias = -0.0004;
    spot.shadow.normalBias = 0.02;
    spot.shadow.radius = 4;
    scene.add(spot, spot.target);

    // Видимый луч прожектора в дымке
    const beamTexture = canvasTexture(16, (g, s) => {
      const grd = g.createLinearGradient(0, 0, 0, s);
      grd.addColorStop(0, '#fff');
      grd.addColorStop(1, '#000');
      g.fillStyle = grd;
      g.fillRect(0, 0, s, s);
    });
    const beamH = 13.5;
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.35, Math.tan(Math.PI / 5.2) * beamH * 0.95, beamH, 48, 1, true),
      new THREE.MeshBasicMaterial({
        map: beamTexture,
        color: 0x9a9484,
        transparent: true,
        opacity: 0.16,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
        fog: false,
      })
    );
    beam.position.y = 14 - beamH / 2;
    scene.add(beam);

    // Цветная подсветка углов
    function cornerLight(angle, hex) {
      const light = new THREE.SpotLight(hex, 6, 0, Math.PI / 4, 0.8, 0);
      light.position.set((R + 2.5) * Math.cos(angle), 6, (R + 2.5) * Math.sin(angle));
      light.target.position.set(-1.2 * Math.cos(angle), 0, -1.2 * Math.sin(angle));
      scene.add(light, light.target);

      const glow = new THREE.PointLight(hex, 3, 4, 1.5);
      glow.position.set((R - 0.4) * Math.cos(angle), 1.3, (R - 0.4) * Math.sin(angle));
      scene.add(glow);

      const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture, color: hex, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.55 }));
      halo.position.set(R * Math.cos(angle), FENCE_H + 0.15, R * Math.sin(angle));
      halo.scale.setScalar(1.4);
      scene.add(halo);
      return light;
    }
    cornerLight(RED_ANGLE, 0xff1e2d);
    cornerLight(BLUE_ANGLE, 0x2a5bff);

    // Слабая контровая подсветка трибун, чтобы силуэты читались
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      const rim = new THREE.SpotLight(0x6b7fb0, 3.5, 0, Math.PI / 3, 0.9, 0);
      rim.position.set(3 * Math.cos(a), 9, 3 * Math.sin(a));
      rim.target.position.set(-(R + 7) * Math.cos(a), 0, -(R + 7) * Math.sin(a));
      scene.add(rim, rim.target);
    }

    // ---------- Дымка (медленные клубы дыма) ----------
    const smoke = [];
    for (let i = 0; i < 14; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: smokeTexture,
        transparent: true,
        opacity: 0.09,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      }));
      const a = Math.random() * Math.PI * 2;
      const r = 3 + Math.random() * 9;
      s.position.set(r * Math.cos(a), 3 + Math.random() * 6, r * Math.sin(a));
      s.scale.setScalar(6 + Math.random() * 6);
      s.userData = { a, r, speed: (Math.random() - 0.5) * 0.03, baseY: s.position.y, phase: Math.random() * 6 };
      smoke.push(s);
      scene.add(s);
    }

    // ---------- Вспышки фотоаппаратов ----------
    const flashMat = new THREE.SpriteMaterial({ map: glowTexture, color: 0xffffff, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
    const flashes = Array.from({ length: 30 }, () => {
      const s = new THREE.Sprite(flashMat.clone());
      s.visible = false;
      s.userData.life = 0;
      scene.add(s);
      return s;
    });
    let flashTimer = 0;
    function spawnFlash() {
      const f = flashes.find(s => !s.visible);
      if (!f) return;
      const p = people[(Math.random() * people.length) | 0];
      f.position.set(p.x * 0.97, p.y + 0.95 * p.s, p.z * 0.97);
      f.userData.life = 0.12 + Math.random() * 0.08;
      f.userData.max = f.userData.life;
      f.scale.setScalar(0.8 + Math.random() * 0.6);
      f.visible = true;
    }
    function updateFlashes(dt) {
      const rate = hype ? 14 : 1.2;   // вспышек в секунду
      flashTimer += dt * rate;
      while (flashTimer > 1) {
        flashTimer -= Math.random() * 2;
        spawnFlash();
      }
      flashes.forEach(f => {
        if (!f.visible) return;
        f.userData.life -= dt;
        if (f.userData.life <= 0) { f.visible = false; return; }
        f.material.opacity = f.userData.life / f.userData.max;
      });
    }

    // ---------- Камера облёта ----------
    const cameraRig = {
      target: new THREE.Vector3(0, 0.4, 0),  // позже — точка между бойцами
      radius: 10.5,
      height: 6.6,
      speed: (Math.PI * 2) / 70,             // один круг за ~70 сек
      angle: Math.PI / 2,
    };
    function updateCamera(t, dt) {
      cameraRig.angle += cameraRig.speed * dt;
      const r = cameraRig.radius + Math.sin(t * 0.21) * 0.5;
      const h = cameraRig.height + Math.sin(t * 0.17) * 0.4;
      camera.position.set(r * Math.cos(cameraRig.angle), h, r * Math.sin(cameraRig.angle));
      camera.lookAt(cameraRig.target);
    }

    // ---------- Главный цикл ----------
    const clock = new THREE.Clock();
    const fpsEl = document.getElementById('fps');
    let frames = 0, fpsTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const t = clock.elapsedTime;

      updateCamera(t, dt);
      updateCrowd(t);
      updateFlashes(dt);
      smoke.forEach(s => {
        const u = s.userData;
        u.a += u.speed * dt;
        s.position.set(u.r * Math.cos(u.a), u.baseY + Math.sin(t * 0.2 + u.phase) * 0.4, u.r * Math.sin(u.a));
      });

      renderer.render(scene, camera);

      frames++;
      fpsTime += dt;
      if (fpsTime >= 0.5) {
        fpsEl.textContent = `${Math.round(frames / fpsTime)} FPS`;
        frames = 0;
        fpsTime = 0;
      }
    }
    animate();

    // Для проверки: клавиша H включает/выключает «хайп зала» (вспышки и движение толпы)
    window.addEventListener('keydown', e => {
      if (e.code === 'KeyH') hype = !hype;
    });

    // Доступ для следующих шагов (бойцы, игра, HUD)
    window.OFL = { THREE, scene, camera, renderer, cameraRig, setHype: v => { hype = v; } };
  </script>
</body>
</html>
